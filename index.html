<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>Verbouwing 3D</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%232f6fdb'/%3E%3Cpath d='M12 27v-8h8v8' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./js/vendor/three/three.module.min.js",
        "three/addons/": "./js/vendor/three/addons/",
        "@anthropic-ai/sdk": "./js/vendor/anthropic-sdk/index.mjs",
        "@opentelemetry/api": "./js/vendor/opentelemetry-api/index.mjs",
        "standardwebhooks": "./js/vendor/anthropic-sdk-shims/standardwebhooks.mjs",
        "./js/vendor/anthropic-sdk/internal/node.mjs": "./js/vendor/anthropic-sdk/internal/node.browser.mjs",
        "./js/vendor/anthropic-sdk/tools/agent-toolset/node.mjs": "./js/vendor/anthropic-sdk/tools/agent-toolset/node.browser.mjs"
      }
    }
  </script>
  <script type="module" src="js/ui/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></symbol>
    <symbol id="i-zoom" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5" /><path d="M4 16v4h16v-4" /></symbol>
    <symbol id="i-selecteren" viewBox="0 0 24 24"><path d="M6 3.5v15.5l4.2-4.1 2.9 6.1 2.6-1.2-2.9-6h5.7z" /></symbol>
    <symbol id="i-muur" viewBox="0 0 24 24"><path d="M3 8.5h18v7H3z" /><path d="M8 8.5v7M13 8.5v7M18 8.5v7" /></symbol>
    <symbol id="i-deur" viewBox="0 0 24 24"><path d="M2.5 20h3.5M18 20h3.5M6 20V7" /><path d="M6 7a13 13 0 0 1 12 13" stroke-dasharray="2.2 2.2" /></symbol>
    <symbol id="i-raam" viewBox="0 0 24 24"><path d="M2.5 10h4M17.5 10h4M2.5 14h4M17.5 14h4" /><path d="M6.5 8.5h11v7h-11zM6.5 12h11" /></symbol>
    <symbol id="i-ruimte" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" /><path d="M8.5 10.5h7M8.5 14h4.5" /></symbol>
    <symbol id="i-verwijderen" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5" /></symbol>
    <symbol id="i-niveau" viewBox="0 0 24 24"><path d="M2.5 13.5 11 17.5l8.5-4" /><path d="M2.5 9.5 11 13.5l8.5-4L11 5.5z" /><path d="M19.5 1.5v6M16.5 4.5h6" /></symbol>
    <symbol id="i-vergelijk" viewBox="0 0 24 24"><path d="M3 5h7v14H3zM14 5h7v14h-7z" /><path d="M5.5 15h2M5.5 12h2M16.5 15h2M16.5 10h2M16.5 12.5h2" /></symbol>
    <symbol id="i-opdracht" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" /><path d="M8 9.5h8M8 12.5h5" /></symbol>
    <symbol id="i-dak" viewBox="0 0 24 24"><path d="M2 12.5 12 4l10 8.5" /><path d="M5 10.5V20h14v-9.5" /><path d="M16 5v3" /></symbol>
    <symbol id="i-trap" viewBox="0 0 24 24"><path d="M3 20h4v-4h4v-4h4V8h4V4h2" /><path d="M3 20h18" /></symbol>
    <symbol id="i-inrichting" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" /><circle cx="12" cy="13" r="4" /><path d="M8 6.5h8" /></symbol>
    <symbol id="i-afbraak" viewBox="0 0 24 24"><path d="M3 21h18" /><path d="M5 21V10l5-4 4 3" /><path d="M14 9l2 2-2 2 2 2" stroke-dasharray="2 1.5" /><path d="M17.5 4.5l4 4M21.5 4.5l-4 4" /></symbol>
    <symbol id="i-zolder" viewBox="0 0 24 24"><path d="M2 13 12 4l10 9" /><path d="M5 10.5V20h14v-9.5" /><path d="M6 14.5h12" /><path d="M10 9.5h4" /></symbol>
  </svg>

  <div class="app" id="app">
    <header class="kop">
      <div class="merk" aria-hidden="true">
        <svg viewBox="0 0 32 32" class="merk-logo"><path d="M4 15 16 5l12 10v12H4z" /><path d="M12 27v-8h8v8" class="deur" /></svg>
        <span class="merk-naam">Verbouwing&nbsp;3D</span>
      </div>
      <div class="variant-keuze">
        <label for="variant-kiezer" class="verborgen">Variant</label>
        <select id="variant-kiezer" class="variant-kiezer" disabled><option>Laden…</option></select>
        <span id="sync-status" class="sync-status" data-toestand="gelijk" role="status" aria-live="polite">
          <span class="stip" aria-hidden="true"></span><span class="sync-tekst">…</span>
        </span>
      </div>
      <div class="kop-acties">
        <button type="button" id="knop-opdracht" class="knop kop-opdracht" title="Opdracht aan Claude: wijzig het ontwerp in gewone taal" aria-label="Opdracht aan Claude" aria-expanded="false" aria-controls="ai-paneel">
          <svg class="ico" aria-hidden="true"><use href="#i-opdracht" /></svg><span class="knop-tekst">Opdracht</span>
        </button>
        <button type="button" id="knop-vergelijk" class="knop kop-vergelijk" title="Varianten vergelijken (kerncijfers en raming)" aria-label="Vergelijken">
          <svg class="ico" aria-hidden="true"><use href="#i-vergelijk" /></svg><span class="knop-tekst">Vergelijken</span>
        </button>
        <button type="button" id="knop-opslaan-gh" class="knop primair kop-opslaan" title="Opslaan naar GitHub">
          <svg class="ico" aria-hidden="true"><use href="#i-upload" /></svg><span class="knop-tekst">Opslaan</span>
        </button>
        <div class="menu-houder">
          <button type="button" id="knop-menu" class="knop" aria-haspopup="menu" aria-expanded="false" aria-controls="variant-menu">
            <svg class="ico" aria-hidden="true"><use href="#i-menu" /></svg><span class="knop-tekst">Variant</span>
          </button>
          <div id="variant-menu" class="menu" role="menu" hidden>
            <div id="menu-status" class="menu-status" role="presentation"></div>
            <button type="button" role="menuitem" data-actie="nieuw">Nieuw leeg ontwerp…</button>
            <button type="button" role="menuitem" data-actie="dupliceren">Dupliceren…</button>
            <button type="button" role="menuitem" data-actie="hernoemen">Hernoemen…</button>
            <button type="button" role="menuitem" data-actie="verwijderen" class="gevaar">Verwijderen (lokaal)…</button>
            <button type="button" role="menuitem" data-actie="vergelijken">Vergelijken…</button>
            <hr>
            <button type="button" role="menuitem" data-actie="exporteren">Exporteer JSON</button>
            <button type="button" role="menuitem" data-actie="importeren">Importeer JSON…</button>
            <hr>
            <button type="button" role="menuitem" data-actie="opslaan-gh">Opslaan naar GitHub</button>
            <button type="button" role="menuitem" data-actie="ophalen-gh">Ophalen van GitHub</button>
            <hr>
            <button type="button" role="menuitem" data-actie="instellingen">Instellingen…</button>
          </div>
        </div>
      </div>
    </header>

    <div class="balk" role="toolbar" aria-label="Bediening">
      <div class="groep">
        <button type="button" id="knop-undo" class="knop ico-knop" title="Ongedaan maken (Ctrl+Z)" aria-label="Ongedaan maken" disabled><svg class="ico"><use href="#i-undo" /></svg></button>
        <button type="button" id="knop-redo" class="knop ico-knop" title="Opnieuw (Ctrl+Shift+Z)" aria-label="Opnieuw" disabled><svg class="ico"><use href="#i-redo" /></svg></button>
        <button type="button" id="knop-zoom" class="knop ico-knop" title="Zoom alles" aria-label="Zoom alles"><svg class="ico"><use href="#i-zoom" /></svg></button>
      </div>
      <div class="groep">
        <label for="plan-niveau" class="groep-label">Plattegrond</label>
        <select id="plan-niveau" class="compact"></select>
      </div>
      <button type="button" id="knop-weergave" class="knop weergave-toggle" aria-expanded="false" aria-controls="balk-extra" title="Weergave: niveaus en doorsnede" aria-label="Weergave: niveaus en doorsnede">
        <svg class="ico" aria-hidden="true"><use href="#i-sliders" /></svg><span>Weergave</span>
      </button>
      <div id="balk-extra" class="balk-extra">
        <fieldset class="groep niveaus">
          <legend class="groep-label">Niveaus</legend>
          <div id="niveau-vinkjes" class="vinkjes"></div>
        </fieldset>
        <div class="groep doorsnede">
          <label class="vinkje"><input type="checkbox" id="doorsnede-aan"><span>Doorsnede</span></label>
          <input type="range" id="doorsnede-z" min="0" max="9000" step="50" value="1200" aria-label="Hoogte van de doorsnede in mm" disabled>
          <output id="doorsnede-waarde" for="doorsnede-z" class="doorsnede-waarde">uit</output>
        </div>
        <div class="groep hoogtelijnen">
          <label class="vinkje" title="Lijnen van gelijke vrije hoogte in de plattegrond (bv. onder een hellend dak)"><input type="checkbox" id="hoogtelijnen-aan"><span>Hoogtelijnen</span></label>
          <input type="text" id="hoogtelijnen-grenzen" class="compact hl-grenzen" inputmode="decimal" autocomplete="off" aria-label="Hoogtes van de hoogtelijnen in mm, gescheiden door komma" title="Vrije hoogtes (mm), gescheiden door komma. Voorbeeldwaarden, geen norm." disabled>
          <span class="eenheid" aria-hidden="true">mm</span>
        </div>
      </div>
      <button type="button" id="knop-waarschuwingen" class="waarschuwingen-knop" hidden aria-controls="paneel-eig"></button>
    </div>

    <nav class="tabs" role="tablist" aria-label="Weergave">
      <button type="button" role="tab" id="tab-3d" data-paneel="3d" aria-selected="true">3D</button>
      <button type="button" role="tab" id="tab-2d" data-paneel="2d" aria-selected="false">2D</button>
      <button type="button" role="tab" id="tab-eig" data-paneel="eig" aria-selected="false">Eigenschappen</button>
    </nav>

    <main class="werkvlak" id="werkvlak" data-actief="3d">
      <section class="paneel paneel-view" id="paneel-3d" aria-label="3D-weergave">
        <div class="view-houder" id="view-3d"></div>
        <div class="view-titel" aria-hidden="true">3D</div>
        <div class="legende" aria-label="Kleurcode">
          <span><i class="sw sw-bestaand"></i>bestaand</span>
          <span><i class="sw sw-nieuw"></i>nieuw</span>
          <span><i class="sw sw-afbraak"></i>afbraak</span>
        </div>
      </section>
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Verdeling 3D / 2D" tabindex="0"></div>
      <section class="paneel paneel-view" id="paneel-2d" aria-label="Plattegrond">
        <div class="view-houder" id="view-2d"></div>
        <div class="view-titel" aria-hidden="true">Plattegrond <span id="plan-titel-niveau"></span></div>
        <div class="legende" aria-label="Kleurcode">
          <span><i class="sw sw-bestaand"></i>bestaand</span>
          <span><i class="sw sw-nieuw"></i>nieuw</span>
          <span><i class="sw sw-afbraak"></i>afbraak</span>
        </div>
      </section>
      <aside class="paneel paneel-eig" id="paneel-eig" aria-label="Eigenschappen">
        <div id="waarschuwingen" class="waarschuwingen" hidden></div>
        <div id="eigenschappen" class="eigenschappen"></div>
      </aside>
    </main>

    <div class="taakbalk" id="taakbalk" data-gereedschap="selecteren"></div>
  </div>

  <aside id="ai-paneel" class="ai-paneel" role="region" hidden></aside>

  <input type="file" id="import-bestand" accept=".json,application/json" hidden>
  <div id="meldingen" class="meldingen" aria-live="polite"></div>
  <noscript><p class="noscript">Deze app heeft JavaScript nodig.</p></noscript>
</body>
</html>
