<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Views testen</title>
<script type="importmap">
{ "imports": {
  "three": "../js/vendor/three/three.module.min.js",
  "three/addons/": "../js/vendor/three/addons/"
} }
</script>
<style>
  :root { --rand: #d8d4ce; --tekst: #2c2a28; --zacht: #6a655f; --accent: #3b7fd9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f4f2ee; color: var(--tekst); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--rand); background: #fff; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header label { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  header .groep { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button, select { font: inherit; padding: 4px 10px; border: 1px solid var(--rand); border-radius: 6px; background: #fff; min-height: 32px; }
  #info { color: var(--zacht); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; min-height: 0; }
  .paneel { position: relative; min-height: 0; border: 1px solid var(--rand); border-radius: 8px; overflow: hidden; background: #fff; }
  .paneel > .titel { position: absolute; top: 6px; left: 8px; z-index: 1; font-size: 12px; color: var(--zacht); background: rgba(255,255,255,.85); padding: 1px 6px; border-radius: 4px; pointer-events: none; }
  .vlak { position: absolute; inset: 0; }
  #pinfo { font: 12px ui-monospace, monospace; color: var(--zacht); min-width: 24ch; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    header { padding: 8px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Views (ontwikkelpagina)</h1>
  <span class="groep" id="niveaus3d"></span>
  <label>Doorsnede <input type="range" id="doorsnede" min="0" max="9000" step="100" value="9000"><span id="dsWaarde">uit</span></label>
  <label>2D-niveau <select id="niveau2d"></select></label>
  <label><input type="checkbox" id="maten" checked> maten</label>
  <label><input type="checkbox" id="hoogtelijnen"> hoogtelijnen</label>
  <button id="kader">Alles tonen</button>
  <label>2D-modus <select id="modus"><option value="navigeren">navigeren</option><option value="gereedschap">gereedschap (muur-demo)</option></select></label>
  <span id="info">selectie: –</span>
  <span id="pinfo">–</span>
</header>
<main>
  <div class="paneel"><span class="titel">3D</span><div class="vlak" id="v3d"></div></div>
  <div class="paneel"><span class="titel">Plattegrond</span><div class="vlak" id="v2d"></div></div>
</main>
<script type="module">
  import { Viewer3D } from '../js/views/viewer3d.js';
  import { Plattegrond } from '../js/views/plan2d.js';

  import { applyOps, migreer } from '../js/model/index.js';

  // ?ontwerp=<id> (designs/<id>.json) en optioneel ?ops=<naam> (tools/voorbeelden/<naam>.ops.json, enkel in het geheugen toegepast)
  const zoek = new URLSearchParams(location.search);
  const ontwerp = zoek.get('ontwerp') || 'voorbeeld';
  let model = migreer(await (await fetch(`../designs/${ontwerp}.json`)).json());
  if (zoek.get('ops')) {
    const bestand = await (await fetch(`../tools/voorbeelden/${zoek.get('ops')}.ops.json`)).json();
    const r = applyOps(model, Array.isArray(bestand) ? bestand : bestand.ops || [bestand]);
    if (!r.ok) console.error('ops niet toepasbaar', r.fouten);
    else model = r.model;
  }

  const v3 = new Viewer3D(document.getElementById('v3d'));
  const v2 = new Plattegrond(document.getElementById('v2d'));
  const staat = { verborgen: new Set(), doorsnede: null, selectie: null, niveau: zoek.get('niveau') || model.niveaus[0]?.id, maten: true, hoogtelijnen: zoek.has('hoogtelijnen') };
  document.getElementById('hoogtelijnen').checked = staat.hoogtelijnen;

  const hoogste = Math.max(...model.niveaus.map((n) => n.peil + n.hoogte)) + 5000;
  const ds = document.getElementById('doorsnede');
  ds.max = hoogste; ds.value = hoogste;

  const n3 = document.getElementById('niveaus3d');
  const sel2 = document.getElementById('niveau2d');
  for (const n of model.niveaus) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" checked data-niveau="${n.id}"> ${n.naam}`;
    n3.appendChild(l);
    sel2.add(new Option(n.naam, n.id));
  }

  function teken() {
    v3.render(model, { verborgenNiveaus: [...staat.verborgen], doorsnede: staat.doorsnede, selectie: staat.selectie });
    v2.render(model, { niveau: staat.niveau, selectie: staat.selectie, toonMaten: staat.maten, toonHoogtelijnen: staat.hoogtelijnen });
    document.getElementById('info').textContent = `selectie: ${staat.selectie ?? '–'}`;
  }
  const kies = (id) => { staat.selectie = id; teken(); };
  v3.opSelectie(kies);
  v2.opSelectie(kies);

  n3.addEventListener('change', (e) => {
    const id = e.target.dataset.niveau;
    if (e.target.checked) staat.verborgen.delete(id); else staat.verborgen.add(id);
    teken();
  });
  ds.addEventListener('input', () => {
    const v = Number(ds.value);
    staat.doorsnede = v >= hoogste ? null : v;
    document.getElementById('dsWaarde').textContent = staat.doorsnede == null ? 'uit' : `${v} mm`;
    teken();
  });
  sel2.value = staat.niveau;
  sel2.addEventListener('change', () => { staat.niveau = sel2.value; teken(); });
  document.getElementById('hoogtelijnen').addEventListener('change', (e) => { staat.hoogtelijnen = e.target.checked; teken(); });
  document.getElementById('maten').addEventListener('change', (e) => { staat.maten = e.target.checked; teken(); });
  document.getElementById('kader').addEventListener('click', () => { v3.zoomAlles(); v2.zoomAlles(); });

  // ── interactie-testbank (enkel lokale demo; wijzigt het model niet) ─────
  // navigeren: geselecteerde muur is sleepbaar, grepen op de eindpunten; slepen toont een voorbeeld.
  // gereedschap: muur-demo (tik start, tik eind, dubbeltik stopt) met voorbeeld, maat, label en snap-punt.
  const log = [];
  const r50 = (v) => Math.round(v / 50) * 50;
  const muurVan = (id) => model.muren.find((m) => m.id === id);
  let sleep = null; // { van, doel }
  let keten = null; // startpunt muur-demo
  function hulpSelectie(extra = {}) {
    const mu = muurVan(staat.selectie);
    const punten = mu && mu.niveau === staat.niveau ? [{ p: mu.start, soort: 'greep' }, { p: mu.eind, soort: 'greep' }] : [];
    return { punten, ...extra, punten: [...punten, ...(extra.punten || [])] };
  }
  function synchroniseer() {
    const mu = muurVan(staat.selectie);
    v2.zetSleepbaar(mu ? [mu.id] : []);
    if (staat.modus === 'navigeren') v2.toonHulp(hulpSelectie());
  }
  v2.opPointer((e) => {
    log.push({ soort: e.soort, doel: e.doel, pointerType: e.pointerType, punt: e.punt.map(Math.round) });
    if (log.length > 500) log.shift();
    document.getElementById('pinfo').textContent = `${e.soort} ${e.pointerType} [${e.punt.map(Math.round)}] ${e.doel ?? '–'}`;
    if (e.soort === 'beweeg' && !sleep && keten == null) v2.markeer(e.doel && !e.doel.startsWith('greep:') ? e.doel : null);
    const p = e.punt.map(r50);
    if (staat.modus === 'navigeren') {
      const mu = muurVan(staat.selectie);
      if (!mu) return;
      if (e.soort === 'neer') sleep = { van: p, doel: e.doel };
      else if (e.soort === 'beweeg' && sleep) {
        const d = [p[0] - sleep.van[0], p[1] - sleep.van[1]];
        const greep = sleep.doel?.startsWith('greep:') ? Number(sleep.doel.slice(6)) : -1;
        const a = greep === 0 ? p : [mu.start[0] + (greep === 1 ? 0 : d[0]), mu.start[1] + (greep === 1 ? 0 : d[1])];
        const b = greep === 1 ? p : [mu.eind[0] + (greep === 0 ? 0 : d[0]), mu.eind[1] + (greep === 0 ? 0 : d[1])];
        v2.toonHulp(hulpSelectie({ lijnen: [{ van: a, naar: b, stijl: 'voorbeeld', dikte: mu.dikte }, { van: a, naar: b, stijl: 'maat' }] }));
      } else if (e.soort === 'op' || e.soort === 'annuleer') { sleep = null; synchroniseer(); }
      return;
    }
    // gereedschap: muur-demo
    if (e.soort === 'tik') {
      if (keten == null) keten = p;
      else { tekenKeten(p, true); keten = p; }
    } else if (e.soort === 'dubbeltik' || e.soort === 'annuleer') { keten = null; v2.toonHulp(null); }
    else if (e.soort === 'beweeg') tekenKeten(p, false);
  });
  const vast = [];
  function tekenKeten(p, vastleggen) {
    if (vastleggen) vast.push([keten, p]);
    const lijnen = vast.map(([a, b]) => ({ van: a, naar: b, stijl: 'voorbeeld', dikte: 140 }));
    const labels = [];
    const punten = [{ p, soort: 'snap' }];
    if (keten) {
      lijnen.push({ van: keten, naar: p, stijl: 'voorbeeld', dikte: 140 });
      lijnen.push({ van: [keten[0], keten[1] - 600], naar: [p[0], p[1] - 600], stijl: 'maat' });
      lijnen.push({ van: [keten[0], -100000], naar: [keten[0], 100000], stijl: 'hulplijn' });
      labels.push({ p: [(keten[0] + p[0]) / 2, (keten[1] + p[1]) / 2 + 400], tekst: `${Math.round(Math.hypot(p[0] - keten[0], p[1] - keten[1]))} mm` });
    }
    v2.toonHulp({ lijnen, punten, labels, polygonen: [{ contour: [[300, 300], [6700, 300], [6700, 4430], [300, 4430]], stijl: 'markering' }] });
  }
  const modusSel = document.getElementById('modus');
  modusSel.addEventListener('change', () => {
    staat.modus = modusSel.value;
    v2.zetModus(staat.modus);
    keten = null; sleep = null; vast.length = 0;
    v2.toonHulp(null);
    synchroniseer();
  });
  staat.modus = 'navigeren';
  const kiesOud = kies;
  v2.opSelectie((id) => { kiesOud(id); synchroniseer(); });
  v3.opSelectie((id) => { kiesOud(id); synchroniseer(); });

  teken();
  window.__views = { v3, v2, staat, teken, model, log };
</script>
</body>
</html>
